name: Update Sitemap Date

on:
  push:
    branches:
      - main
    # Allowlist statt Ignore-Liste: lastmod/dateModified nur bumpen, wenn der
    # Push tatsächlich den sichtbaren Seiteninhalt betrifft. Pushes, die nur
    # Docs, Config, .htaccess, robots/sitemap oder Backend-Scripts (deploy.php,
    # contact.php, update-previews.php) ändern, lösen keinen Bump aus — so
    # bleibt das Freshness-Signal ehrlich statt bei jedem Commit hochzuzählen.
    # Hinweis: Der Action-eigene Commit (person.php/sitemap.xml via
    # GITHUB_TOKEN) triggert keinen neuen Lauf — GitHub unterbindet Rekursion.
    paths:
      - 'index.php'
      - 'about/index.php'
      - 'includes/**'
      - 'css/**'
      - 'js/**'
      - 'images/oliver-eichhof*'

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update lastmod dates in sitemap
        run: |
          TODAY=$(date -u +"%Y-%m-%d")
          sed -i "s/<lastmod>[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}<\/lastmod>/<lastmod>${TODAY}<\/lastmod>/g" sitemap.xml

      - name: Update dateModified in JSON-LD config
        run: |
          TODAY=$(date -u +"%Y-%m-%d")
          sed -i "s/'dateModified' => '[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}'/'dateModified' => '${TODAY}'/" includes/config/person.php

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git diff --quiet sitemap.xml includes/config/person.php || (git add sitemap.xml includes/config/person.php && git commit -m "Update sitemap lastmod and JSON-LD dateModified to $(date -u +%Y-%m-%d)" && git push)
