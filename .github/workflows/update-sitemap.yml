name: Update Sitemap Date

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - 'README.md'

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update lastmod dates in sitemap
        run: |
          TODAY=$(date -u +"%Y-%m-%d")
          sed -i "s/<lastmod>[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}<\/lastmod>/<lastmod>${TODAY}<\/lastmod>/g" sitemap.xml

      - name: Update dateModified in JSON-LD config
        run: |
          TODAY=$(date -u +"%Y-%m-%d")
          sed -i "s/'dateModified' => '[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}'/'dateModified' => '${TODAY}'/" includes/config/person.php

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git diff --quiet sitemap.xml includes/config/person.php || (git add sitemap.xml includes/config/person.php && git commit -m "Update sitemap lastmod and JSON-LD dateModified to $(date -u +%Y-%m-%d)" && git push)
